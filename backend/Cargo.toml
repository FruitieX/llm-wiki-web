[package]
name = "llm-wiki-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
argon2 = "=0.6.0"
base64 = "=0.23.1"
rand = "=0.10.3"
sha2 = "=0.11.1"
chrono = { version = "=0.4.45", features = ["serde"] }
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
tempfile = "=3.27.0"
tower-http = { version = "=0.7.1", features = ["fs", "trace", "limit", "catch-panic"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
